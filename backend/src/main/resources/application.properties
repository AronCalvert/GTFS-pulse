spring.application.name=GTFS-pulse

server.servlet.contextPath=/api/v1
spring.kafka.listener.type=batch

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.group-id=gtfs-pulse
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=dev.aroncalvert.gtfspulse.dto.VehicleData

spring.datasource.url=jdbc:postgresql://localhost:5432/gtfspulse
spring.datasource.username=postgres
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update

spring.data.redis.host=localhost
spring.data.redis.port=6379

